
name: Deploy SDP-BESR Camera Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-camera-edge-functions.yml"

jobs:
  deploy-camera-functions:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: mcbwbcqetrrwxfqfvhkc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

      - name: Deploy camera-device-register
        run: supabase functions deploy camera-device-register --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy camera-admin-manage
        run: supabase functions deploy camera-admin-manage --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy camera-assignment-manage
        run: supabase functions deploy camera-assignment-manage --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy camera-heartbeat
        run: supabase functions deploy camera-heartbeat --project-ref "$SUPABASE_PROJECT_ID" --use-api
