name: Deploy SDP-BESR Access Administration Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/sdp-access-admin/**"
      - ".github/workflows/deploy-sdp-access-admin.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: mcbwbcqetrrwxfqfvhkc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi
      - name: Deploy sdp-access-admin
        run: supabase functions deploy sdp-access-admin --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes
